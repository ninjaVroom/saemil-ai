[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saemil"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
studio = ["fastapi", "uvicorn"]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "mypy"]

[project.scripts]
saemil-prepare = "scripts.prepare_data:main"
saemil-distill = "scripts.distill_data:main"
saemil-train = "scripts.train:main"
saemil-benchmark = "scripts.benchmark:main"

[tool.setuptools.package-data]
saemil = ["py.typed"]

[tool.setuptools.packages.find]
include = ["saemil*", "heads*", "scripts*", "studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["saemil", "heads", "studio", "saemil_bridge"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # dense one-line comments are deliberate; the formatter is not used

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]  # compact fixture builders

[tool.mypy]
files = ["saemil", "heads", "studio", "scripts", "saemil_bridge.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
